services:
  - type: web
    name: mediscan-ai
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_DEBUG
        value: false
      - key: CORS_ORIGIN
        value: "*"
    disk:
      name: models-disk
      mountPath: /opt/render/project/src/models
      sizeGB: 2
