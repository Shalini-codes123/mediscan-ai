name: MediScan AI — CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Test Backend ─────────────────────────────────────────────────────
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run backend tests
        run: pytest tests/ -v --tb=short
        # Skip if no models yet (CI won't have Kaggle key)
        continue-on-error: true

      - name: Health-check Flask app (no models)
        run: |
          python -c "
          from app import app
          c = app.test_client()
          r = c.get('/health')
          print(r.get_json())
          "

  # ── 2. Build Frontend ───────────────────────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install & build
        run: |
          npm install
          npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: backend/static/

  # ── 3. Deploy to Render (only on push to main) ──────────────────────────
  deploy:
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json"
        # Set RENDER_DEPLOY_HOOK in GitHub repo secrets
        # Get it from: Render dashboard → your service → Settings → Deploy Hook
